name: digaudio
description: "digaudio — a lightweight, modern, high-quality audio player (local + Subsonic)."
publish_to: 'none'
version: 0.13.1+27

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + nav
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Audio
  just_audio: ^0.9.40
  # Direct audio_service (replaces just_audio_background since v0.11.0):
  # we need a custom AudioHandler to expose the Android Auto browsable
  # tree (getChildren / playFromMediaId), which JAB hides.
  audio_service: ^0.18.17
  audio_session: ^0.1.21

  # Network + crypto (Subsonic)
  dio: ^5.7.0
  crypto: ^3.0.5

  # Local media permissions (MediaStore is queried via our own channel
  # `digaudio/media_store` — see android/.../MediaStoreChannel.kt).
  permission_handler: ^11.3.1

  # Storage
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+5

  # Sharing (playlist export) + picking (playlist import)
  share_plus: ^10.1.2
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.2
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    # Bundled at runtime for the Home page hero (the build-time launcher
    # icon generator already pulls from this same file, but at runtime
    # Image.asset needs the path registered explicitly).
    - assets/icon/digaudio_icon.png

# Run `dart run flutter_launcher_icons` to regenerate launcher icons from the
# PNGs in assets/icon/. Source PNGs are produced by `tool/make_icon.py`.
flutter_launcher_icons:
  android: "ic_launcher"        # write to res/mipmap-*/ic_launcher.png
  image_path: "assets/icon/digaudio_icon.png"
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: "assets/icon/digaudio_icon_fg.png"
  min_sdk_android: 29
