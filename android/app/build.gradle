plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing — opt-in via env vars set by CI (or locally).
// If KEYSTORE_FILE points at a valid .jks AND the password env vars are
// set, release builds use it. Otherwise we fall back to debug signing
// (same as before) so local builds keep working without a keystore.
//
// CI flow:
//   1. Decode KEYSTORE_BASE64 secret → /tmp/digaudio-release.jks
//   2. Export KEYSTORE_FILE=/tmp/digaudio-release.jks
//   3. Export KEYSTORE_PASSWORD + KEY_PASSWORD (often equal) + KEY_ALIAS
//   4. flutter build apk --release
def keystoreFile = System.getenv('KEYSTORE_FILE')
def hasReleaseKeystore = keystoreFile != null && !keystoreFile.isEmpty() && file(keystoreFile).exists()

android {
    namespace = "com.digaudio.digaudio"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.digaudio.digaudio"
        minSdk = 29
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile = file(keystoreFile)
                storePassword = System.getenv('KEYSTORE_PASSWORD')
                keyAlias = System.getenv('KEY_ALIAS') ?: 'digaudio'
                // Many keystores reuse the store password for the key.
                // We honour KEY_PASSWORD if set, otherwise reuse the store one.
                keyPassword = System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseKeystore
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
